<!doctype html><meta charset=utf-8><title>Album curator</title>
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
body{background:#0b0b0d;color:#ddd;font:14px system-ui;margin:0;overflow:hidden}
#top{display:flex;gap:14px;align-items:center;padding:8px 14px;background:#16161a}
#top b{color:#8cf} button{background:#2b6;color:#fff;border:0;border-radius:6px;padding:7px 14px;font-weight:700;cursor:pointer}
button.gray{background:#444} #msg{color:#9a9;white-space:pre-wrap;font-size:12px;max-height:80px;overflow:auto;padding:0 14px}
a.back{color:#8cf;text-decoration:none;font-weight:700}
#stage{display:flex;flex-direction:row;align-items:center;height:calc(100vh - 118px);justify-content:center;gap:14px;overflow:hidden}
#imgcol{display:flex;flex-direction:column;align-items:center}
#exif{min-width:170px;max-width:210px;background:#16161a;border-radius:8px;padding:12px;font-size:13px;line-height:1.55}
#exif b{color:#8cf;display:block;font-size:15px;margin-bottom:2px}
#exif .lens{color:#888;font-size:11px;line-height:1.3;margin-top:6px}
#big{max-width:82vw;max-height:calc(100vh - 190px);border:5px solid #333;border-radius:8px;cursor:zoom-in}
#big.sel{border-color:#3c3}
#big.wild{border-color:#e90}
#big.sadie{border-color:#e6e}
#big.family{border-color:#48f}
/* Loupe (ported from the website's detail view): click raises a round
   magnifier on the pointer, the wheel zooms, click/Esc/leaving drops it.
   On touch: press and hold, it rises above the finger and follows it. */
.loupe{position:fixed;left:0;top:0;z-index:60;width:var(--lp,132px);height:var(--lp,132px);
  pointer-events:none;opacity:0;will-change:transform,opacity;transition:opacity .14s}
.loupe.on{opacity:1}
.loupe>i{position:absolute;inset:0;border-radius:50%;background-color:#0b0b0d;background-repeat:no-repeat;
  box-shadow:0 0 0 2px rgba(255,255,255,.88),0 0 0 3px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.5);
  transform:scale(.55);transition:transform .2s cubic-bezier(.2,1.5,.4,1)}
.loupe.on>i{transform:scale(1)}
.loupe.hd-wait>i{animation:loupeWait 1.1s ease-in-out infinite}
@keyframes loupeWait{50%{box-shadow:0 0 0 2px rgba(255,255,255,.35),0 0 0 3px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.5)}}
@media (prefers-reduced-motion:reduce){.loupe>i{transition:none;transform:none;animation:none!important}}
#big.loupe-on{cursor:none}
@media (hover:none) and (pointer:coarse){ #big{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}}
#cap{margin:6px 0 2px;font-size:15px}
#cap .keep{color:#6f6;font-weight:800} #cap .wild{color:#fb4;font-weight:800}
#cap .sadie{color:#f8f;font-weight:800} #cap .family{color:#7af;font-weight:800}
#strip{display:flex;gap:4px;padding:6px 10px;overflow-x:hidden}
#strip img{height:64px;border-radius:4px;opacity:.45;border:2px solid transparent}
#strip img.cur{opacity:1;border-color:#8cf} #strip img.sel{opacity:.9;border-color:#3c3}
kbd{background:#26262c;border-radius:4px;padding:1px 6px;margin:0 2px}
#actions{display:flex;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  background:#16161a;align-items:center;justify-content:center}
#actions button{flex:1;max-width:150px;padding:14px 6px;font-size:16px;border-radius:10px}
#keepbtn{background:#2b6} #keepbtn.on{background:#3c3;color:#062}
.tagb{background:#333}.tagb.on{background:#e90;color:#111}
.tagb.sadie.on{background:#e6e;color:#111}.tagb.family.on{background:#48f}
@media (max-width:820px){
  #hints{display:none}
  #top{gap:8px;padding:6px 10px;font-size:12px;flex-wrap:wrap}
  #top button{padding:6px 9px;font-size:12px}
  #topTags{display:none}
  #stage{flex-direction:column;height:auto;gap:6px;padding-top:6px}
  #big{max-width:98vw;max-height:52vh}
  #exif{display:flex;flex-wrap:wrap;gap:4px 12px;max-width:98vw;min-width:0;font-size:12px;padding:8px 10px}
  #exif b{display:inline;font-size:13px;margin:0}
  #exif .lens{width:100%;margin:0}
  #strip img{height:46px}
  #cap{font-size:13px}
}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b0b0d;font-size:18px;color:#8cf}
</style>
<body>
<div id=top>
  <a class=back href="/">← workflow</a>
  <b id=daylbl></b><span id=poslbl></span><span id=keptlbl></span>
  <span id=hints style="flex:1;text-align:center;color:#888">
    <kbd>→</kbd> skip <kbd>space</kbd>/<kbd>K</kbd> keep <kbd>W</kbd> 🦌 <kbd>S</kbd> 🐕 <kbd>F</kbd> 👨‍👩‍👧 <kbd>X</kbd> unkeep <kbd>Z</kbd> loupe <kbd>N</kbd> next day
  </span>
  <span id=topTags><button class=gray onclick="setWild()">🦌</button>
  <button class=gray onclick="setSadie()">🐕</button>
  <button class=gray onclick="setFamily()">👨‍👩‍👧</button></span>
  <button class=gray id=donebtn onclick="toggleDone()"></button>
  <button class=gray id=fullbtn onclick="toggleFull()"></button>
  <button class=gray onclick="jumpDay(-1)">◀ day</button>
  <button class=gray onclick="jumpDay(1)">day ▶</button>
  <button id=syncbtn onclick="doSync()">⬆ Sync albums</button>
</div>
<div id=stage><div id=imgcol><img id=big><div id=cap></div></div><div id=exif></div></div>
<div id=actions>
  <button class=gray onclick="nav(-1)">‹ prev</button>
  <button id=keepbtn onclick="setPick(!sel[cur().day].has(cur().id))">✓ keep</button>
  <button class="tagb wild"   id=wbtn onclick="setWild()">🦌</button>
  <button class="tagb sadie"  id=sbtn onclick="setSadie()">🐕</button>
  <button class="tagb family" id=fbtn onclick="setFamily()">👨‍👩‍👧</button>
  <button class=gray onclick="nav(1)">next ›</button>
</div>
<div id=strip></div>
<div id=msg></div>
<div id=load>Loading days from Synology…</div>
<script>
let allDays=[], flat=[], idx=0, sel={}, wl={}, sd={}, fm={};
let showDone = localStorage.getItem('curate_show_done')==='1';
// Off by default: the downscaled preview is ~145 KB against ~500 KB, which
// matters on cellular; on home wifi the bytes are free.
// This is NOT the original. The originals are ~26 MB Nikon NEFs that no
// browser can display, and 1920x1280 is the largest rendition Synology will
// serve, so hi-res here means 1920 against 1280 — half again the detail, not
// the 6016x4016 the camera shot. Judging critical sharpness still belongs in
// Lightroom.
let fullSize = localStorage.getItem('curate_full_size')==='1';
function imgSrc(id){ return fullSize ? '/curate-thumb/xl/'+id : '/curate-preview/'+id; }
function updateFullBtn(){
  const b = document.getElementById('fullbtn');
  if(b) b.textContent = fullSize ? '🖼 hi-res 1920' : '🗜 fast 1280';
}
function toggleFull(){
  fullSize = !fullSize;
  localStorage.setItem('curate_full_size', fullSize ? '1' : '0');
  updateFullBtn(); render();
}
// A day is "done" once it has any album on the NAS — skip it by default so a
// long backlog doesn't make you re-review work you've already finished.
function dayDone(d){ return Object.values(d.albums||{}).some(v => v && v.length); }
function buildFlat(){
  flat=[];
  for(const d of allDays){
    if(!showDone && dayDone(d)) continue;
    d.items.forEach(it=>flat.push({day:d.day, ...it}));
  }
}
function updateDoneBtn(){
  const n = allDays.filter(dayDone).length;
  const b = document.getElementById('donebtn');
  if(b) b.textContent = showDone ? `👁 all (${n} done)` : `⊘ ${n} done hidden`;
}
function toggleDone(){
  const keep = cur() && cur().id;
  showDone = !showDone;
  localStorage.setItem('curate_show_done', showDone ? '1' : '0');
  buildFlat(); updateDoneBtn();
  const i = flat.findIndex(f => f.id === keep);
  idx = i >= 0 ? i : 0;
  render();
}
async function q(u,o){const r=await fetch(u,o);return r.json()}
async function boot(){
  const st=await q('/api/curate/state');
  if(!st.ok){document.getElementById('load').textContent='Failed: '+(st.error||'?');return}
  allDays = st.days;
  for(const d of st.days){
    sel[d.day]=new Set(d.sel.best); wl[d.day]=new Set(d.sel.wildlife);
    sd[d.day]=new Set(d.sel.sadie); fm[d.day]=new Set(d.sel.family);
  }
  buildFlat(); updateDoneBtn(); updateFullBtn();
  document.getElementById('load').remove();
  const last=parseInt(localStorage.getItem('curate_last_id')||'-1');
  const i=flat.findIndex(f=>f.id===last);
  idx=i>=0?i:0; render();
}
function cur(){return flat[idx]}
function nav(d){idx=Math.max(0,Math.min(flat.length-1,idx+d));render()}
function render(){
  const c=cur();
  if(!c){
    document.getElementById('big').removeAttribute('src');
    document.getElementById('cap').innerHTML =
      '<b>Nothing left to review.</b> Every day in range already has an album — tap “done hidden” above to revisit them.';
    document.getElementById('daylbl').textContent='';
    document.getElementById('poslbl').textContent='';
    document.getElementById('keptlbl').textContent='';
    document.getElementById('strip').innerHTML='';
    document.getElementById('exif').innerHTML='';
    return;
  }
  localStorage.setItem('curate_last_id', c.id);
  loupe.end();
  const s=sel[c.day].has(c.id), w=wl[c.day].has(c.id), sda=sd[c.day].has(c.id), fam=fm[c.day].has(c.id);
  const big=document.getElementById('big');
  // Downscaled and cached app-side; falls back to the raw NAS thumbnail.
  big.onerror=()=>{big.onerror=null;big.src='/curate-thumb/m/'+c.id};
  big.src=imgSrc(c.id);
  big.className=(s?'sel ':'')+(w?'wild ':'')+(sda?'sadie ':'')+(fam?'family':'');
  document.getElementById('daylbl').textContent=c.day;
  const di=flat.filter(f=>f.day===c.day), pos=di.findIndex(f=>f.id===c.id);
  document.getElementById('poslbl').textContent=(pos+1)+' / '+di.length;
  document.getElementById('keptlbl').textContent=
    'kept: '+sel[c.day].size+' · wild: '+wl[c.day].size+' · sadie: '+sd[c.day].size+' · fam: '+fm[c.day].size;
  document.getElementById('cap').innerHTML=c.fn+
    (s?' <span class=keep>✓ KEEP</span>':'')+(w?' <span class=wild>🦌</span>':'')+
    (sda?' <span class=sadie>🐕</span>':'')+(fam?' <span class=family>👨‍👩‍👧</span>':'');
  document.getElementById('keepbtn').classList.toggle('on', s);
  document.getElementById('wbtn').classList.toggle('on', w);
  document.getElementById('sbtn').classList.toggle('on', sda);
  document.getElementById('fbtn').classList.toggle('on', fam);
  const eid=c.id;
  q('/api/curate/exif/'+eid).then(x=>{
    if(cur().id!==eid) return;
    document.getElementById('exif').innerHTML = !x||!x.shutter&&!x.camera ? '' :
      `<b>${x.shutter}</b><b>${x.aperture}</b><b>ISO ${x.iso}</b>`+
      `${x.focal}<br>${x.time}<br>${x.res}`+
      `<div class=lens>${x.camera}<br>${x.lens}</div>`;
  });
  const strip=document.getElementById('strip'); strip.innerHTML='';
  for(let i=Math.max(0,idx-3); i<Math.min(flat.length, idx+12); i++){
    const f=flat[i], im=document.createElement('img');
    im.src='/curate-thumb/m/'+f.id; im.loading='lazy';
    im.className=(i===idx?'cur ':'')+(sel[f.day].has(f.id)?'sel':'');
    im.onclick=()=>{idx=i;render()};
    strip.appendChild(im);
  }
  // Preload ahead, and two back so a bounce to the previous frame is instant.
  // Deeper than it was: swiping quickly used to outrun a 5-frame window.
  // Preload less far ahead at full size — those are ~3.5x the bytes.
  const ahead = fullSize ? 4 : 10;
  for(let i=idx+1;i<Math.min(flat.length,idx+ahead);i++){(new Image()).src=imgSrc(flat[i].id)}
  for(let i=Math.max(0,idx-2);i<idx;i++){(new Image()).src=imgSrc(flat[i].id)}
}
async function push(kind, set, day){
  await q('/api/curate/set',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({day:day,kind:kind,ids:[...set]})});
}
async function setPick(on){
  const c=cur(); on?sel[c.day].add(c.id):sel[c.day].delete(c.id);
  render(); await push('best', sel[c.day], c.day);
}
async function setWild(){
  const c=cur(); wl[c.day].has(c.id)?wl[c.day].delete(c.id):wl[c.day].add(c.id);
  render(); await push('wildlife', wl[c.day], c.day);
}
async function setSadie(){
  const c=cur(); sd[c.day].has(c.id)?sd[c.day].delete(c.id):sd[c.day].add(c.id);
  render(); await push('sadie', sd[c.day], c.day);
}
async function setFamily(){
  const c=cur(); fm[c.day].has(c.id)?fm[c.day].delete(c.id):fm[c.day].add(c.id);
  render(); await push('family', fm[c.day], c.day);
}
function jumpDay(dir){
  const d=cur().day; let i=idx;
  if(dir>0){while(i<flat.length-1&&flat[i].day===d)i++;}
  else{while(i>0&&flat[i].day===d)i--; const d2=flat[i].day; while(i>0&&flat[i-1].day===d2)i--;}
  idx=i; render();
}
async function doSync(){
  const b=document.getElementById('syncbtn'); b.disabled=true; b.textContent='⏳ syncing…';
  try{
    const r=await q('/api/curate/sync',{method:'POST'});
    document.getElementById('msg').textContent=(r.log||[r.error||'sync failed']).join('\n');
  }finally{ b.disabled=false; b.textContent='⬆ Sync albums'; }
}
const bigEl=document.getElementById('big');
/* Loupe, ported from the website's detail view (templates/_field.html).
   Opens at 3x on the photo on screen; the 1920 px copy loads behind it and
   it eases in to 5x on that. The wheel zooms 1.5x-10x. */
const loupe=(function(){
  const img=bigEl, HOLD=260, SLOP=9, LIFT=30, ZOOM_WEB=3, ZOOM_HD=5;
  let el=null, timer=null, on=false, start=null, last=null, raf=0, down=false;
  let mouse=false, userZoom=false, zoom=ZOOM_WEB, zoomTo=ZOOM_WEB, hdSrc=null, hdFor=null;
  const hdCache=[];   // [{url, ok, waiters}], last three
  const api={claimed:false, end};
  const reduceMotion=()=>!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
  const dia=()=>mouse?Math.round(Math.min(340,Math.max(220,innerHeight*.38)))
                     :Math.round(Math.min(300,Math.max(200,innerWidth*.62)));
  function hd(url, aspect, cb){
    for(const c of hdCache){ if(c.url!==url) continue; c.ok!==null?cb(c.ok):c.waiters.push(cb); return; }
    const e={url, ok:null, waiters:[cb]}, im=new Image();
    hdCache.push(e); if(hdCache.length>3) hdCache.shift();
    const settle=ok=>{e.ok=ok; e.waiters.splice(0).forEach(w=>w(ok));};
    im.onload=()=>{const go=()=>settle(Math.abs(im.naturalWidth/im.naturalHeight/aspect-1)<.02);
      im.decode?im.decode().then(go,go):go();};
    im.onerror=()=>settle(false);
    im.src=url;
  }
  function contentRect(){   // the picture inside the 5px border
    const r=img.getBoundingClientRect();
    return {left:r.left+img.clientLeft, top:r.top+img.clientTop, width:img.clientWidth, height:img.clientHeight};
  }
  function paint(){
    raf=0; if(!on||!last) return;
    const d=dia(), r=contentRect();
    const u=Math.max(0,Math.min(r.width,last.x-r.left)), v=Math.max(0,Math.min(r.height,last.y-r.top));
    if(Math.abs(zoomTo-zoom)>.01&&!reduceMotion()){zoom+=(zoomTo-zoom)*.16; schedule();} else zoom=zoomTo;
    const src=hdSrc||img.currentSrc||img.src, disc=el.firstChild;
    if(el.dataset.src!==src){el.dataset.src=src; disc.style.backgroundImage='url("'+src.replace(/"/g,'\\"')+'")';}
    el.style.setProperty('--lp',d+'px');
    const bw=r.width*zoom, bh=r.height*zoom;
    disc.style.backgroundSize=bw+'px '+bh+'px';
    disc.style.backgroundPosition=(d/2-u*zoom)+'px '+(d/2-v*zoom)+'px';
    let x,y;
    if(mouse){x=last.x-d/2; y=last.y-d/2;}
    else{x=Math.max(6,Math.min(innerWidth-d-6,last.x-d/2)); y=last.y-d-LIFT-22; if(y<6) y=last.y+LIFT+22;}
    el.style.transform='translate3d('+x+'px,'+y+'px,0)';
    disc.style.transformOrigin=(last.x-x)+'px '+(last.y-y)+'px';
  }
  function schedule(){ if(!raf) raf=requestAnimationFrame(paint); }
  function begin(){
    timer=null;
    const c=cur();
    if(!start||!c||!img.naturalWidth) return;
    if(!el){el=document.createElement('div'); el.className='loupe'; el.setAttribute('aria-hidden','true');
      el.appendChild(document.createElement('i')); document.body.appendChild(el);}
    on=true; api.claimed=true; last=start;
    if(hdFor!==c.id){hdSrc=null; hdFor=c.id;}
    zoom=zoomTo=hdSrc?ZOOM_HD:ZOOM_WEB;
    const url='/curate-thumb/xl/'+c.id;
    if(!hdSrc && (img.currentSrc||img.src).indexOf(url)<0){
      const id=c.id; el.classList.add('hd-wait');
      hd(url, img.naturalWidth/img.naturalHeight, ok=>{
        if(hdFor!==id) return;
        if(el) el.classList.remove('hd-wait');
        if(!ok) return;
        hdSrc=url; if(on){ if(!userZoom) zoomTo=ZOOM_HD; schedule(); }
      });
    }
    paint(); void el.offsetWidth; el.classList.add('on');
    if(!mouse&&navigator.vibrate) try{navigator.vibrate(8)}catch(e){}
  }
  function end(){
    clearTimeout(timer); timer=null; start=null;
    if(!on) return;
    on=false; if(raf){cancelAnimationFrame(raf); raf=0;}
    if(el) el.classList.remove('on');
    mouse=false; userZoom=false; img.classList.remove('loupe-on');
  }
  // Touch: hold to raise; moving first is a swipe.
  img.addEventListener('touchstart',e=>{
    api.claimed=false; end(); down=true;
    if(e.touches.length!==1) return;
    start={x:e.touches[0].clientX, y:e.touches[0].clientY}; timer=setTimeout(begin,HOLD);
  },{passive:true});
  img.addEventListener('touchmove',e=>{
    const t=e.touches[0];
    if(e.touches.length!==1){end(); return;}
    if(!on){ if(start&&Math.hypot(t.clientX-start.x,t.clientY-start.y)>SLOP){clearTimeout(timer); timer=null; start=null;} return; }
    e.preventDefault(); last={x:t.clientX, y:t.clientY}; schedule();
  },{passive:false});
  const lift=e=>{ if(!e.touches.length) down=false; end(); };
  img.addEventListener('touchend',lift,{passive:true});
  img.addEventListener('touchcancel',lift,{passive:true});
  img.addEventListener('contextmenu',e=>{ if(down||on||api.claimed) e.preventDefault(); });
  img.draggable=false;
  // Mouse: click to raise, move to steer, wheel to zoom, click to drop.
  function raiseAt(x,y){ end(); mouse=true; start={x,y}; begin(); if(on) img.classList.add('loupe-on'); else mouse=false; }
  img.addEventListener('pointerdown',e=>{
    if(e.pointerType!=='mouse'||e.button!==0) return;
    e.preventDefault();
    if(on&&mouse){end(); return;}
    raiseAt(e.clientX,e.clientY);
  });
  img.addEventListener('mousemove',e=>{ if(!on||!mouse) return; last={x:e.clientX,y:e.clientY}; schedule(); });
  img.addEventListener('mouseleave',()=>{ if(mouse) end(); });
  img.addEventListener('wheel',e=>{
    if(!on||!mouse) return;
    e.preventDefault(); userZoom=true;
    const step=Math.pow(1.0022,-(e.deltaMode===1?e.deltaY*33:e.deltaY));
    zoomTo=Math.max(1.5,Math.min(hdSrc?10:6,zoomTo*step)); schedule();
  },{passive:false});
  addEventListener('keydown',e=>{
    if(e.key==='Escape'&&on&&mouse){end(); e.stopPropagation(); e.preventDefault();}
  },true);
  img.addEventListener('load',()=>{ if(on) schedule(); });
  addEventListener('blur',end);
  document.addEventListener('visibilitychange',end);
  // Z: toggle it at the centre of the photo (or under the pointer if it's on the photo).
  let px=null, py=null;
  addEventListener('mousemove',e=>{px=e.clientX; py=e.clientY;},{passive:true});
  api.toggle=()=>{
    if(on){end(); return;}
    const r=contentRect(), inside=px!==null&&px>=r.left&&px<=r.left+r.width&&py>=r.top&&py<=r.top+r.height;
    raiseAt(inside?px:r.left+r.width/2, inside?py:r.top+r.height/2);
  };
  return api;
})();
let _tx=0,_ty=0;
bigEl.addEventListener('touchstart',e=>{const t=e.changedTouches[0];_tx=t.clientX;_ty=t.clientY;},{passive:true});
bigEl.addEventListener('touchend',e=>{
  if(loupe.claimed) return;   // a hold that raised the loupe is not a swipe
  const t=e.changedTouches[0], dx=t.clientX-_tx, dy=t.clientY-_ty;
  if(Math.abs(dx)>40 && Math.abs(dx)>Math.abs(dy)) nav(dx<0?1:-1);
},{passive:true});
document.addEventListener('keydown',e=>{
  if(e.key==='z'||e.key==='Z'){loupe.toggle()}
  else if(e.key==='ArrowRight'){idx=Math.min(flat.length-1,idx+1);render()}
  else if(e.key==='ArrowLeft'){idx=Math.max(0,idx-1);render()}
  else if(e.key===' '||e.key==='k'||e.key==='K'){e.preventDefault();setPick(!sel[cur().day].has(cur().id))}
  else if(e.key==='x'||e.key==='X'){setPick(false)}
  else if(e.key==='w'||e.key==='W'){setWild()}
  else if(e.key==='s'||e.key==='S'){setSadie()}
  else if(e.key==='f'||e.key==='F'){setFamily()}
  else if(e.key==='n'||e.key==='N'){jumpDay(1)}
});
boot();
</script>
