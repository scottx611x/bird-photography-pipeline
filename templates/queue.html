<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Queue · Bird Pipeline</title>
<style>
  :root {
    --bg:#15171a; --panel:#1d2024; --line:#2c3137; --ink:#e6e8ea;
    --dim:#9aa3ad; --accent:#6ea8fe; --warn:#f0a35e; --bad:#e5706b; --good:#6cc08b;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  header { padding:18px 22px; border-bottom:1px solid var(--line);
           display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; }
  h1 { font-size:18px; margin:0; font-weight:600; }
  .muted { color:var(--dim); font-size:12px; }
  main { padding:18px 22px; max-width:900px; }
  .banner { padding:10px 14px; border-radius:8px; margin-bottom:16px; font-size:13px;
            border:1px solid var(--line); background:var(--panel); }
  .banner.warn { border-color:var(--warn); color:var(--warn); }
  .post { display:flex; gap:14px; align-items:flex-start; background:var(--panel);
          border:1px solid var(--line); border-radius:10px; padding:12px;
          margin-bottom:10px; cursor:grab; }
  .post.drag { opacity:.45; }
  .post.over { border-color:var(--accent); }
  .thumbs { display:flex; gap:4px; flex:0 0 auto; }
  .thumbs img { width:52px; height:52px; object-fit:cover; border-radius:5px;
                background:#000; border:1px solid var(--line); }
  .more { width:52px; height:52px; border-radius:5px; border:1px dashed var(--line);
          display:grid; place-items:center; color:var(--dim); font-size:12px; }
  .body { flex:1; min-width:0; }
  .cap { white-space:pre-wrap; font-size:13px; margin:0 0 6px; }
  .cap .sp { font-weight:600; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  input[type=datetime-local] { background:#111418; color:var(--ink);
      border:1px solid var(--line); border-radius:6px; padding:4px 7px; font-size:12px; }
  button { background:#262b31; color:var(--ink); border:1px solid var(--line);
      border-radius:6px; padding:4px 10px; font-size:12px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.danger:hover { border-color:var(--bad); color:var(--bad); }
  .pill { font-size:11px; padding:1px 7px; border-radius:99px; border:1px solid var(--line); color:var(--dim); }
  .pill.queued { color:var(--accent); border-color:var(--accent); }
  .pill.paused { color:var(--warn); border-color:var(--warn); }
  .pill.published { color:var(--good); border-color:var(--good); }
  .err { color:var(--bad); font-size:12px; margin-top:4px; }
  .empty { color:var(--dim); padding:40px 0; text-align:center; }
</style>
</head>
<body>
<header>
  <h1>🐦 Post queue</h1>
  <span class="muted" id="sub">loading…</span>
  <span class="muted" style="margin-left:auto"><a href="/" style="color:var(--accent)">← pipeline</a></span>
</header>
<main>
  <div id="banner"></div>
  <div id="list"><div class="empty">loading…</div></div>
</main>

<script>
const $ = s => document.querySelector(s);
let posts = [], dragId = null;

const fmtLocal = iso => {
  const d = new Date(iso);
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
};

async function load() {
  const [qr, hr] = await Promise.all([
    fetch('/api/bq/queue').then(r=>r.json()),
    fetch('/api/bq/health').then(r=>r.json()).catch(()=>({}))
  ]);
  if (qr.error) {
    $('#banner').innerHTML = `<div class="banner warn">${qr.error}${qr.hint?' — '+qr.hint:''}</div>`;
    $('#list').innerHTML = '';
    return;
  }
  posts = qr.posts || [];
  $('#sub').textContent = `${posts.filter(p=>p.status!=='published').length} scheduled · next open slot ${new Date(qr.next_slot).toLocaleString()}`;
  $('#banner').innerHTML = hr.can_publish
    ? `<div class="banner">Publishing enabled · media via <b>${hr.media_backend}</b> · ${hr.species_known} species known</div>`
    : `<div class="banner warn">Publishing is disabled — Instagram credentials not set. The queue still works; nothing will post.</div>`;
  render();
}

function render() {
  if (!posts.length) { $('#list').innerHTML = '<div class="empty">Queue is empty.</div>'; return; }
  $('#list').innerHTML = posts.map(p => {
    const lines = (p.caption||'').split('\n');
    const thumbs = p.images.slice(0,4).map(f =>
      `<img src="/api/bq/media/${p.id}/${encodeURIComponent(f)}" alt="">`).join('');
    const more = p.image_count > 4 ? `<div class="more">+${p.image_count-4}</div>` : '';
    const done = p.status === 'published';
    return `<div class="post" data-id="${p.id}" draggable="${!done}">
      <div class="thumbs">${thumbs}${more}</div>
      <div class="body">
        <p class="cap"><span class="sp">${lines[0]||''}</span>${lines.length>1?'\n'+lines.slice(1).join('\n'):''}</p>
        <div class="row">
          <span class="pill ${p.status}">${p.status}</span>
          ${done
            ? `<span class="muted">posted ${new Date(p.published_at).toLocaleString()}</span>`
            : `<input type="datetime-local" value="${fmtLocal(p.due_at)}" onchange="reschedule('${p.id}', this.value)">
               <button onclick="toggle('${p.id}','${p.status}')">${p.status==='paused'?'Resume':'Pause'}</button>
               <button onclick="publishNow('${p.id}')">Post now</button>
               <button class="danger" onclick="del('${p.id}')">Delete</button>`}
          <span class="muted">${p.image_count} image${p.image_count===1?'':'s'}</span>
        </div>
        ${p.error ? `<div class="err">${p.error}</div>` : ''}
      </div>
    </div>`;
  }).join('');
  wireDrag();
}

function wireDrag() {
  document.querySelectorAll('.post[draggable=true]').forEach(el => {
    el.ondragstart = e => { dragId = el.dataset.id; el.classList.add('drag'); };
    el.ondragend   = () => { dragId = null; document.querySelectorAll('.post').forEach(x=>x.classList.remove('drag','over')); };
    el.ondragover  = e => { e.preventDefault(); el.classList.add('over'); };
    el.ondragleave = () => el.classList.remove('over');
    el.ondrop      = e => {
      e.preventDefault(); el.classList.remove('over');
      if (!dragId || dragId === el.dataset.id) return;
      const open = posts.filter(p => p.status !== 'published').map(p => p.id);
      const from = open.indexOf(dragId), to = open.indexOf(el.dataset.id);
      if (from < 0 || to < 0) return;
      open.splice(to, 0, open.splice(from, 1)[0]);
      send('/api/bq/queue/reorder', 'POST', { order: open });
    };
  });
}

async function send(url, method, body) {
  const r = await fetch(url, {
    method, headers: body ? {'Content-Type':'application/json'} : {},
    body: body ? JSON.stringify(body) : undefined });
  const d = await r.json().catch(()=>({}));
  if (!r.ok) alert(d.error || `${method} ${url} failed (${r.status})`);
  load();
}

const reschedule = (id, local) => send(`/api/bq/posts/${id}`, 'PATCH',
  { due_at: new Date(local).toISOString() });
const toggle = (id, status) => send(`/api/bq/posts/${id}`, 'PATCH',
  { status: status === 'paused' ? 'queued' : 'paused' });
const del = id => confirm('Delete this queued post? The images go too.')
  && send(`/api/bq/posts/${id}`, 'DELETE');
const publishNow = id => confirm('Publish this to Instagram right now?')
  && send(`/api/bq/posts/${id}/publish-now`, 'POST');

load();
setInterval(load, 30000);
</script>
</body>
</html>
