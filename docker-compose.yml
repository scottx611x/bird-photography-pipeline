services:
  bird-workflow:
    build: .
    ports:
      - "8765:8765"
    volumes:
      - ~/Downloads:/downloads
      - ~/Desktop/bird_staging:/staging
      - ~/Desktop/birbs:/birds
      - "~/Library/Application Support/Google/Chrome/Default/Cookies:/chrome-cookies/Cookies:ro"
      # Read-only AWS creds so posting can ship per-photo species records to S3
      # (the website reads them back to label each carousel frame).
      - ~/.aws:/root/.aws:ro

    # BUFFER_TOKEN comes from .env via env_file (resolved relative to this
    # file, so it works even when compose is invoked from another directory).
    env_file:
      - .env
    environment:
      - BUFFER_COOKIES=${BUFFER_COOKIES}
      - MAC_HOME=/Users/scott
      # birdqueue's SSH tunnel listens on the Mac's loopback; 127.0.0.1 in here
      # is the container itself.
      - BIRDQUEUE_URL=http://host.docker.internal:8910
    restart: unless-stopped
